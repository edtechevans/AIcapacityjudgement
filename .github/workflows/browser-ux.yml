name: Browser UX quality

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'ui/**'
      - 'tests/e2e/**'
      - 'content/**'
      - 'curriculum.js'
      - 'learning-data.js'
      - 'playwright.config.mjs'
      - 'package.json'
      - '.github/workflows/browser-ux.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'ui/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: browser-ux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-device-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test cross-browser student journeys, mobile layouts and WCAG issues
        run: npm run test:browser
        env:
          CI: 'true'
      - name: Upload visual-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-studio-visual-review
          path: visual-review/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: learning-studio-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
